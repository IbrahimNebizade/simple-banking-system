databaseChangeLog:
  - changeSet:
      id: 2
      author: ibrahim nebizade
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: balance
                  type: DECIMAL(19,2)